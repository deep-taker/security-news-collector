name: CI

# 코드가 바뀌거나 Dependabot 업데이트 제안(PR)이 오면 자동 시험.
# 수집·브리핑 데이터 커밋(data/, briefings/)에는 돌지 않음 (Actions 사용 시간 절약).
on:
  push:
    branches: [main]
    paths: ["collector/**", "tests/**", "dashboard/**", "supabase/**", "requirements.txt", ".github/workflows/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: 수집기 단위 시험 + 백업·복구 전 과정 시험
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest "psycopg[binary]==3.2.3"
      - name: 단위 시험
        env:
          PRIVATE_WORDS: ${{ secrets.PRIVATE_WORDS }}   # 공개 저장소 개인 단어 검사 (tests/test_public_repo.py, 목록은 Secrets에만)
        run: python -m pytest tests -q
      - name: 시험 자료로 수집 (네트워크 없이)
        run: python -m collector.collect --fixtures tests/fixtures --only boannews,zdnet,dt_ict,aitimes,etnews_sec,ddaily
      - name: 백업·복구 전 과정 (재구축 정의 적용 포함)
        run: python tests/e2e_backup.py "postgresql://postgres:pw@localhost:5432/postgres"

  replay:
    name: 실제 원문 비교 (이전 코드·라이브러리 vs 변경본)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: new
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}
          path: old
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 최근 수집 원문 내려받기 (최근 6회, 7일 보관분)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir raw
          for id in $(gh run list -R "$GITHUB_REPOSITORY" -w collect.yml --status success -L 12 --json databaseId --jq '.[].databaseId' | head -6); do
            gh run download -R "$GITHUB_REPOSITORY" "$id" -D "raw/$id" || true
          done
          echo "원문 파일 $(find raw -name '*.xml' -o -name '*.html' | wc -l)개"
      - name: 이전 코드·라이브러리로 파싱
        run: |
          python -m venv /tmp/v-old && /tmp/v-old/bin/pip -q install -r old/requirements.txt
          cd old && /tmp/v-old/bin/python ../new/tests/tools/replay_parse.py ../raw /tmp/old.json
      - name: 변경본으로 파싱
        run: |
          python -m venv /tmp/v-new && /tmp/v-new/bin/pip -q install -r new/requirements.txt
          cd new && /tmp/v-new/bin/python tests/tools/replay_parse.py ../raw /tmp/new.json
      - name: 비교 (다르면 실패 — 의도한 변경이면 PR에 설명 후 수동 병합)
        run: python new/tests/tools/replay_compare.py /tmp/old.json /tmp/new.json

  dashboard:
    name: 대시보드 빌드
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - name: 브리핑 변환 시험 (공격 문자열·실제 브리핑 기준 비교)
        run: npm test
      - run: npm run build
      - name: 알려진 취약점 점검 (높음 이상)
        run: npm audit --omit=dev --audit-level=high

  report:
    name: main 결과 기록 (실패 시 대시보드 오류·휴대폰 알림)
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [python, dashboard]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Supabase ci_runs 기록
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          PY: ${{ needs.python.result }}
          DASH: ${{ needs.dashboard.result }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ok=true; failed=""
          [ "$PY" != "success" ] && { ok=false; failed="$failed 수집기·백업 시험($PY)"; }
          [ "$DASH" != "success" ] && { ok=false; failed="$failed 대시보드($DASH)"; }
          detail=$([ "$ok" = true ] && echo "모두 통과" || echo "실패한 작업:$failed")
          jq -n --arg sha "$GITHUB_SHA" --argjson ok $ok --arg d "$detail" --arg u "$URL" '[{sha:$sha, ok:$ok, detail:$d, url:$u}]' |
            curl -sS -f -X POST "$SUPABASE_URL/rest/v1/ci_runs" -H "apikey: $SUPABASE_SERVICE_KEY" -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
              -H "Content-Type: application/json" -H "Prefer: return=minimal" --data-binary @-
