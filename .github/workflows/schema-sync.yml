name: DB 정의 동기화 (매일)

# 매일 05:00 KST Supabase pg_cron(schema-sync)이 실행 신호를 보냄.
# 운영 DB의 함수·색인·권한·정책·예약 정의를 supabase/generated/ 에 저장하고, 바뀌었으면 커밋.
on:
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pw
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt "psycopg[binary]==3.2.3"
      - name: 운영 DB 정의 내보내기
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m collector.schema_sync
      - name: 저장소 정의로 재구축 가능한지 점검 (표 열 구성 대조) → 실패 시 대시보드 오류
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python tests/tools/schema_check.py postgresql://postgres:pw@localhost:5432/postgres
      - name: 바뀌었으면 커밋
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add supabase/generated
          if ! git diff --cached --quiet; then
            git commit -m "DB 정의 동기화 $(TZ=Asia/Seoul date +%F)"
            ok=""; for i in 1 2 3; do if git pull --rebase && git push; then ok=1; break; fi; git rebase --abort 2>/dev/null || true; sleep $((i * 10)); done
            [ -n "$ok" ] || { echo "::error::저장소 푸시 3회 실패 — 커밋이 올라가지 않았습니다"; exit 1; }
          fi
