name: 백업 (매일)

# 05:45 KST Supabase pg_cron(backup-daily)이 실행 신호를 보냄. 실패하면 자동 조치(auto_remediate)가 06시 이후 최대 2번 재실행.
# Supabase Storage (collector/backup.py). GitHub 보조 백업은 저장소 공개 전환으로 중단 (2026-10-27)
on:
  workflow_dispatch:

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 백업 (Supabase Storage)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m collector.backup
